<main class="lab-grid"><aside class="research"><div class="eyebrow">01 / 儿童入口探索</div><h1>少一点操作，<br>多一点“我明白了”。</h1><p class="intro">7–10 岁 · iPhone / iPad<br>可点击设计草图，使用独立示例金额；刷新重置。尚未经过儿童试玩。</p><nav class="variant-list" id="variant-list" aria-label="选择交互方案"></nav><div class="rationale" id="rationale"></div><p class="recommendation">首选对比：A 的清楚步骤、C 的自由表达、D 的具体目标。推荐属于待测设计判断。</p></aside><section class="workspace"><div class="tools"><div class="segmented"><button data-device="phone" id="phone-toggle">iPhone 竖屏</button><button data-device="tablet" id="tablet-toggle">iPad 横屏</button></div><div><button class="text-btn" id="reset">重置此方案</button><button class="text-btn" id="present">试玩模式 ↗</button></div></div><div class="stage" id="stage"><div class="device" id="device"><div class="screen" id="screen"></div><span class="prototype-label">设计草图 · 示例数据 · 无真实交易</span><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div></div><details class="inspector"><summary id="state-summary">查看演示状态与操作记录</summary><div class="state-data" id="state-data"></div></details></section></main>

<script>
// Research question: which of five distinct child entries is easiest to understand and worth returning to?
// Memory-only state, isolated from production Flutter, Drift, and authorization; demo funds never enter real families.
const ASSETS=__ASSETS__;
const variants=[
{key:'today',letter:'A',name:'今天一件事',type:'纯 APP · 单行动卡',idea:'一次只突出一个下一步，任务要求、报酬和等待原因都在当前页。',learn:'Rooster Money 的任务提交与审批',url:'https://roostermoney.com/feature/chore-app-rooster-money/',risk:'待测：少选择会不会显得单调？9–10 岁是否希望自己挑任务？'},
{key:'money',letter:'B',name:'零钱桌',type:'纯 APP · 金额直观操作',idea:'先看到零钱和存入的本金，再做一个具体金额动作。以点按为主，不要求精确拖动。',learn:'Rooster Money / Greenlight',url:'https://greenlight.com/chores-and-allowance-app-for-kids',risk:'待测：孩子是否理解“零钱减少、持有增加，总资产没变”？物件隐喻会不会掩盖数字？'},
{key:'room',letter:'C',name:'我的小窝',type:'轻游戏 · 点物件直达',idea:'委托夹、零钱罐、愿望画都能直接点开。保留玩具屋与布置感，省去角色走路。',learn:'Toca Boca World / Pok Pok',url:'https://www.tocaboca.com/toca-boca-world',risk:'待测：孩子能否辨认入口？Pok Pok 偏低龄，不能据此认定 7–10 岁也喜欢。'},

{key:'comic',letter:'E',name:'漫画任务册',type:'互动读物 · 一页一选择',idea:'把任务流程变成有限分镜，一句对白、一个选择，现实行动后再继续这一章。',learn:'Duolingo ABC 的短步骤与互动故事',url:'https://apps.apple.com/us/app/learn-to-read-duolingo-abc/id1440502568',risk:'待测：阅读是否增加负担？Duolingo ABC 偏低龄，故事语气需要分年龄检验。'}
];
const params=new URLSearchParams(location.search);let active=variants.findIndex(v=>v.key===params.get('variant'));if(active<0)active=0;let deviceMode=params.get('device')==='tablet'?'tablet':'phone';let modal=null,depositChoice=1000,toastTimer;

const money=c=>(c/100).toFixed(2);const yuan=c=>Number.isInteger(c/100)?String(c/100):money(c);const img=(n,cls='',alt='')=>`<img src="${ASSETS[n]}" class="${cls}" alt="${alt}">`;
const actLabel=s=>({available:'我来试试',accepted:'我做好了',submitted:'交给家长',checked:'请家长兑现',paid:'看看这次的收获'})[s.phase];

const hint=s=>({available:'现实中整理好书架，家长检查并兑现后获得 8 元。',accepted:'把书分类、摆整齐。做完再回来，没有倒计时。',submitted:'现在是 32 元。提交不会加钱，家长还要检查和兑现。',checked:'检查完成，实际兑现后才记入零钱。',paid:'8 元已兑现，零钱记到你的名下啦。'})[s.phase];
const childHeader=s=>`<div class="statusbar"><span>9:41</span><span>示例家庭 · 原型</span><span>● ▰</span></div><div class="child-top"><span class="child-name">${img('mascot','avatar')}小栗</span><button class="wallet-pill" data-act="wallet" aria-label="查看我的零钱">${yuan(s.cash)} 元零钱</button></div>`;

function today(s){return `<div class="today">${childHeader(s)}<div class="today-body"><div class="today-lead"><div class="hello">☀ 你好，小栗</div><h2>${headline(s)}</h2></div><div class="today-illustration"><span class="sun-dot"></span>${img('book','book')}${img('mascot','squirrel')}</div><article class="task-card"><span class="tag">${s.phase==='paid'?'✓ 已兑现 8 元':'家长兑现后 +8 元'}</span><h3>给书架来次大整理</h3><p>${hint(s)}</p><button class="primary" data-act="task">${actLabel(s)}</button></article><div class="today-bottom"><div><span class="micro">我已经攒了</span><br><strong>${yuan(s.cash+s.holding)} 元</strong></div><button class="secondary" data-act="goal">离望远镜还差 ${yuan(8000-s.cash-s.holding)} 元 ↗</button></div></div>${footer()}</div>`}

function comic(s){const num={available:1,accepted:2,submitted:3,checked:3,paid:4}[s.phase],dialog={available:'书架有点乱，<br>你愿意帮个忙吗？',accepted:'把同类书放一起。<br>现实中做好，再回来！',submitted:'我整理好啦！<br>请家长来看看。',checked:'检查通过啦。<br>还要等报酬实际兑现哦。',paid:'这是你劳动换来的！<br>8 元已经记好啦。'}[s.phase];return `<div class="comic">${childHeader(s)}<div class="comic-heading"><div><small>栗子行动册 · 第一话</small><h2>书架大作战</h2></div><span class="chapter-number">0${num}</span></div><div class="comic-layout"><div class="comic-panels"><div class="comic-scene"><div class="comic-bubble">${dialog}</div>${img('mascot','hero')}${img('book','books')}${s.phase==='paid'?'<div class="comic-stamp">劳动完成 ✓</div>':''}</div></div><div class="comic-side"><div class="comic-caption">${hint(s)}<br><span class="micro">约定报酬：8 元 · 没有通关金币</span></div><div class="comic-action"><button class="primary" data-act="task">${s.phase==='available'?'我愿意，看看怎么做':actLabel(s)} →</button><div class="page-dots">${[1,2,3,4].map(i=>`<span class="${i===num?'on':''}"></span>`).join('')}</div></div></div></div>${footer()}</div>`}
const views=[today,moneyView,room,wish,comic];
function render(){const v=variants[active],s=state();document.getElementById('variant-list').innerHTML=variants.map((v,i)=>`<button class="variant-option ${i===active?'active':''}" data-variant="${i}" ${i===active?'aria-current="page"':''}><span class="variant-letter">${v.letter}</span><span><b>${v.name}</b><small>${v.type}</small></span></button>`).join('');document.getElementById('rationale').innerHTML=`<h2>这款在验证什么</h2><p>${v.idea}</p><h2 style="margin-top:16px">借鉴的机制</h2><a href="${v.url}" target="_blank" rel="noopener">${v.learn} ↗</a><p style="margin-top:9px">${v.risk}</p>`;document.getElementById('screen').innerHTML=views[active](s);document.getElementById('device').className='device'+(deviceMode==='tablet'?' tablet':'');document.getElementById('phone-toggle').className=deviceMode==='phone'?'on':'';document.getElementById('tablet-toggle').className=deviceMode==='tablet'?'on':'';document.getElementById('variant-label').textContent=`${v.letter} / ${v.name} · ${active+1}/5`;document.getElementById('state-summary').textContent=`演示状态：${phases[s.phase]} · 零钱 ${money(s.cash)} 元 · 持有 ${money(s.holding)} 元`;document.getElementById('state-data').innerHTML=`<span><strong>身份：</strong>独立示例孩子“小栗”</span><span><strong>任务：</strong>${phases[s.phase]}</span><span><strong>可用零钱：</strong>${money(s.cash)} 元</span><span><strong>持有本金：</strong>${money(s.holding)} 元</span><span><strong>当前资产：</strong>${money(s.cash+s.holding)} 元</span><span><strong>愿望：</strong>80.00 元 · ${(100*(s.cash+s.holding)/8000).toFixed(0)}%</span><span><strong>债务 / 冻结：</strong>0.00 / 0.00 元</span><span><strong>场景：</strong>${s.light?'灯亮':'灯灭'} · 坐垫 ${s.cushion+1}</span><ol>${s.events.map(e=>`<li>${e}</li>`).join('')}</ol>`;renderModal();}
function navigate(i){active=(i+variants.length)%variants.length;modal=null;document.getElementById('toast-root').innerHTML='';const url=new URL(location.href);url.searchParams.set('variant',variants[active].key);history.replaceState(null,'',url);render();}
function record(text){state().events.push(text)}
function toast(text){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML=`<div class="toast" role="status">${text}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3400)}
function openModal(name){modal=name;renderModal();requestAnimationFrame(()=>document.querySelector('#modal-root .close')?.focus())}
function task(){const s=state();openModal(s.phase==='submitted'||s.phase==='checked'?'parent':s.phase==='paid'?'success':'task')}
function renderModal(){const root=document.getElementById('modal-root');if(!modal){root.innerHTML='';return}const s=state();let title='',body='';
if(modal==='task'){title='给书架来次大整理';body=`<span class="tag">家长兑现后获得 8 元</span><p>${s.phase==='available'?'接下后，去现实中动手。做完再回来提交。':'不着急。整理好以后，再点“交给家长检查”。'}</p><div class="requirement"><b>怎么才算做好？</b>① 把同类的书放在一起<br>② 摆整齐，书脊朝外<br>③ 请家长检查一次</div><p class="notice">提交或检查通过，都不会立刻增加零钱。家长确认报酬已实际兑现后，才会记入。</p><button class="primary" data-act="${s.phase==='available'?'accept':'submit'}">${s.phase==='available'?'接下这件事':'整理好了，交给家长检查'}</button>`}
if(modal==='parent'){title='家长演示空间';body=`<span class="tag">原型演示 · 此处不验证口令</span><p>正在管理：小栗 · 书架大整理 · 报酬 8 元</p><div class="requirement"><b>${phases[s.phase]}</b>${s.phase==='submitted'?'请先在现实中检查：书是否分类、摆整齐？检查通过后，仍需确认实际兑现。':s.phase==='checked'?'检查已通过。只有实际兑现确认，才会增加孩子零钱。':s.phase==='paid'?'这项委托已经兑现，不会重复入账。':'孩子还没有提交。请先回到孩子界面完成任务。'}</div>${s.phase==='submitted'?'<button class="primary" data-act="check">检查通过 · 暂不入账</button>':s.phase==='checked'?'<label class="check-row"><input type="checkbox" id="fulfilled"><span>我已按家庭约定实际兑现 8 元报酬，确认可以记入孩子零钱。</span></label><button class="primary" data-act="pay" id="pay-button" disabled>确认兑现 · 记入 8 元</button>':''}<p class="notice">正式 APP 必须通过家长凭证和业务入口校验。本页只演示两步操作，不代表真实付款或存档。</p>`}
if(modal==='success'){title='这次劳动的收获';body=`<div class="success-center"><div class="success-mark">✓</div><h3>是你自己做到的。</h3><p>家长已经实际兑现这次劳动报酬。</p><p class="modal-amount">+8.00 元</p><p>现在拥有 ${money(s.cash+s.holding)} 元。<br>离 80 元的望远镜又近了一点。</p></div><button class="primary" data-act="close">回去看看</button>`}
if(modal==='wallet'){title='我的钱，记得清楚';body=`<div class="ledger-line"><span>可用零钱</span><b>${money(s.cash)} 元</b></div><div class="ledger-line"><span>存入的本金</span><b>${money(s.holding)} 元</b></div><div class="ledger-line"><span>当前资产</span><b>${money(s.cash+s.holding)} 元</b></div><p class="micro" style="margin-top:18px">示例记录（刷新后重置）</p>${s.events.map(e=>`<div class="journal-entry">${e}</div>`).join('')}<button class="primary" data-act="close">我知道了</button>`}
if(modal==='goal'){title='我的第一台望远镜';body=`<div class="success-center">${img('telescope','', '望远镜插画')}<p class="modal-amount">${money(s.cash+s.holding)} / 80 元</p><p>还差 ${money(8000-s.cash-s.holding)} 元。<br>愿望是一张进度图，没有多出一份钱。</p></div><p class="notice">以后可继续接入愿望编辑、领取、家庭教学储蓄和成长对比。预计收益与预支都不能冒充已攒到的钱。</p><button class="primary" data-act="close">慢慢来，也会靠近</button>`}
if(modal==='deposit'){title='拿一点零钱存起来';body=`<p>演示一张新的家庭教学约定。家长需在正式 APP 提前配置规则与预算。</p><div class="deposit-options">${[1000,2000].map(c=>`<button data-deposit="${c}" class="${depositChoice===c?'selected':''}" ${c>s.cash?'disabled':''}>${yuan(c)} 元</button>`).join('')}</div><div class="requirement"><b>先看清这次约定</b>存入 ${yuan(depositChoice)} 元 · 90 天<br>示例年化 3% · 预计利息 ${money(Math.round(depositChoice*300*90/3650000))} 元<br>到期回到零钱 · 本页不推进日期</div><div class="ledger-line"><span>零钱</span><b>${money(s.cash)} → ${money(s.cash-depositChoice)} 元</b></div><div class="ledger-line"><span>持有本金</span><b>${money(s.holding)} → ${money(s.holding+depositChoice)} 元</b></div><p class="notice">总资产仍为 ${money(s.cash+s.holding)} 元。存入只转移本金，预计利息现在不入账。</p><button class="primary" data-act="save" ${depositChoice>s.cash?'disabled':''}>按这份约定存入 ${yuan(depositChoice)} 元</button>`}
root.innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><header class="sheet-header"><h2>${title}</h2><button class="close" data-act="close" aria-label="关闭面板">×</button></header>${body}</section></div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.variant!==undefined){navigate(Number(b.dataset.variant));return}if(b.dataset.device){deviceMode=b.dataset.device;const url=new URL(location.href);url.searchParams.set('device',deviceMode);history.replaceState(null,'',url);render();return}if(b.dataset.deposit){depositChoice=Number(b.dataset.deposit);renderModal();return}const s=state();switch(b.dataset.act){case 'task':task();break;case 'parent':openModal('parent');break;case 'wallet':openModal('wallet');break;case 'goal':openModal('goal');break;case 'deposit':depositChoice=1000;openModal('deposit');break;case 'close':modal=null;renderModal();break;case 'accept':if(s.phase!=='available')return;s.phase='accepted';record('接下现实劳动委托：约定报酬 8 元，未入账。');modal=null;render();toast('接下啦！现在去整理真实的书架。');break;case 'submit':if(s.phase!=='accepted')return;s.phase='submitted';record('孩子提交：等待家长检查，未入账。');modal=null;render();toast('已交给家长，零钱没有变化。');break;case 'check':if(s.phase!=='submitted')return;s.phase='checked';record('家长检查通过：等待实际兑现，未入账。');render();toast('检查完成，接下来确认实际兑现。');break;case 'pay':if(s.phase!=='checked'||!document.getElementById('fulfilled')?.checked)return;s.phase='paid';s.cash+=800;record('家长确认实际兑现：劳动收入 +8.00 元（仅一次）。');modal='success';render();toast('8 元报酬已记好。');break;case 'save':if(s.cash<depositChoice)return;s.cash-=depositChoice;s.holding+=depositChoice;record(`演示存入：零钱转持有 ${money(depositChoice)} 元，资产不变；90 天、年化 3%。`);modal=null;render();toast(`存入 ${yuan(depositChoice)} 元，总资产没变。`);break;case 'lamp':s.light=!s.light;render();toast(s.light?'小灯亮了。零钱不变。':'晚点再开灯。零钱不变。');break;case 'cushion':s.cushion=(s.cushion+1)%3;render();toast('换个喜欢的颜色。零钱不变。');break;case 'squirrel':toast('你好！不用每天来，也没有错过惩罚。');break;}});
document.addEventListener('change',e=>{if(e.target.id==='fulfilled')document.getElementById('pay-button').disabled=!e.target.checked});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable="true"]'))return;if(e.key==='Escape'&&modal){modal=null;renderModal();return}if(modal)return;if(e.key==='ArrowLeft'){e.preventDefault();navigate(active-1)}if(e.key==='ArrowRight'){e.preventDefault();navigate(active+1)}});
document.getElementById('prev').onclick=()=>navigate(active-1);document.getElementById('next').onclick=()=>navigate(active+1);document.getElementById('reset').onclick=()=>{states[active]=initial();modal=null;render();toast('此方案已回到独立示例起点。')};document.getElementById('present').onclick=()=>{const url=new URL(location.href);url.searchParams.set('present','1');location.href=url};if(params.get('present')==='1')document.body.classList.add('present');render();
if(params.get('overview')==='1'){document.body.classList.add('overview');document.getElementById('stage').innerHTML=variants.map((v,i)=>`<div class="mini-wrap"><h2>${v.letter} / ${v.name}</h2><div class="device mini-device"><div class="screen">${views[i](initial())}</div></div></div>`).join('');}
</script>
</body></html>
